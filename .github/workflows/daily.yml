name: Daily prices and deploy

on:
  schedule:
    - cron: "30 4 * * *" # 10:00 IST (04:30 UTC). GitHub may start it a few minutes late.
  workflow_dispatch: # "Run workflow" button in the Actions tab
  push:
    branches: [main] # redeploys the site; does NOT call GoldAPI

permissions:
  contents: write # commit the updated database
  pages: write
  id-token: write

concurrency:
  group: daily-prices
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r backend/requirements.txt

      # Fetches new prices only on the daily schedule or a manual run, never on a push.
      # Edit the DUTY_SCHEDULE / GST_PCT lines below when tax rates change, then push.
      - name: Refresh prices and export JSON
        id: job
        continue-on-error: true
        working-directory: backend
        env:
          REFRESH: ${{ github.event_name != 'push' }}
          GOLDAPI_KEY: ${{ secrets.GOLDAPI_KEY }}
          DB_PATH: ../data/prices.db
          DUTY_SCHEDULE: "2000-01-01:6,2026-05-13:15"
          GST_PCT: "3"
          MONTHLY_REQUEST_BUDGET: "90"
          STALE_AFTER_HOURS: "30"
        run: python scripts/daily_job.py --out ../frontend/public/data

      - name: Save database (history and request counter)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.db
          if git diff --staged --quiet; then
            echo "Database unchanged."
          else
            git commit -m "Update prices"
            git pull --rebase
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build website
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - id: deployment
        uses: actions/deploy-pages@v4

      # The site is deployed even if the price refresh failed. This marks the run red
      # so GitHub emails you.
      - name: Fail the run if the price refresh failed
        if: steps.job.outcome == 'failure'
        run: |
          echo "Price refresh or export failed. Check the 'Refresh prices and export JSON' step."
          exit 1
